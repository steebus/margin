<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- The faces the first screen is set in, fetched with the page so text doesn't re-wrap when they arrive. -->
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource/league-gothic/files/league-gothic-latin-400-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource-variable/source-serif-4/files/source-serif-4-latin-wght-normal.woff2" />
    <link rel="preload" as="font" type="font/woff2" crossorigin href="/node_modules/@fontsource/courier-prime/files/courier-prime-latin-400-normal.woff2" />
    <meta name="theme-color" content="#d8d6cf" />
    <title>Margin</title>
    <script>
      // Applied before first paint, so a saved theme never flashes the other one.
      try {
        var theme = localStorage.getItem('margin.theme')
        if (theme === 'light' || theme === 'dark') document.documentElement.dataset.theme = theme
        var dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)
        // --paper in styles/tokens.css, so the status bar matches the page from the first frame.
        document.querySelector('meta[name="theme-color"]').content = dark ? '#1b1b19' : '#d8d6cf'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
